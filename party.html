<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13151b">
<meta name="description" content="Everyone on their own phone: create a party, share the code, race through mini-games.">
<title>Cab Clash · Party</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%2313151b'/%3E%3Cpath d='M0 0h1v1H0zM2 0h1v1H2zM1 1h1v1H1zM3 1h1v1H3zM0 2h1v1H0zM2 2h1v1H2zM1 3h1v1H1zM3 3h1v1H3z' fill='%23f6c432'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
#app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: each player on their own phone. Header bar with a taxi-checker edge, then one full-height play stage. */
:root{
  --night:#13151b;
  --panel:#1c1f28;
  --ink:#f3efe4;
  --dim:#8a8f9e;
  --yellow:#f6c432;
  --go:#38d968;
  --bad:#ff5d5d;
  --btn:#232733;
  --line:#3a4050;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:18px;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 16px;position:relative;background:var(--night)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;z-index:2;
  background:repeating-conic-gradient(var(--yellow) 0 25%,var(--night) 0 50%) 0 0/12px 12px}
.chip{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;min-width:0}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot-c{width:12px;height:12px;border-radius:50%;flex:none}
#hd-mid{font:700 14px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}
#hd-tot{font-family:var(--display);font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.stage{display:flex;align-items:center;justify-content:center;padding:28px 16px 20px;overflow-y:auto;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background-color .12s}
.stage.wait{background:#0d0e12}
.stage.go{background:var(--go);color:var(--night)}
.stage.miss{background:#3a1416}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:440px;text-align:center}
.big{font-family:var(--display);font-size:clamp(26px,8.5vw,44px);line-height:1.08;text-wrap:balance}
.huge{font-family:var(--display);font-size:clamp(56px,22vw,116px);line-height:1;font-variant-numeric:tabular-nums}
.rule{font-size:20px;line-height:1.3;max-width:34ch;opacity:.85;text-wrap:balance}
.eyebrow{font:700 14px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.eq{font-family:var(--display);font-size:clamp(30px,10vw,52px);font-variant-numeric:tabular-nums}
.word{font-family:var(--display);font-size:clamp(34px,12vw,60px);letter-spacing:.02em}
.sym{font-size:clamp(70px,26vw,130px);line-height:1;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
.tag{font:400 clamp(20px,6vw,30px) var(--display);letter-spacing:.06em}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.opts.four{grid-template-columns:repeat(2,1fr)}
.opts.grid{grid-template-columns:repeat(4,1fr);gap:8px}
.opts.grid .opt{height:56px;font-size:30px}
.opts.stack{grid-template-columns:1fr;gap:8px}
.opts.stack .opt{height:54px;font-size:24px}
.opts.two .opt{height:90px;font:400 clamp(20px,6vw,28px) var(--display)}
.opt{font:700 26px var(--body);color:var(--ink);background:var(--btn);border:2px solid var(--line);border-radius:14px;height:66px;font-variant-numeric:tabular-nums;touch-action:manipulation}
.dots{position:relative;width:100%;height:clamp(110px,22vh,170px);border:2px dashed var(--line);border-radius:12px}
.dot{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.prog{display:flex;gap:6px}
.prog i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--yellow)}
.field{width:100%;font:700 24px var(--body);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center}
.field:focus{outline:none;border-color:var(--yellow)}
.btn{font:400 18px var(--display);letter-spacing:.04em;color:var(--night);background:var(--yellow);border:0;border-radius:14px;padding:18px 22px;width:100%}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,.pick button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pick{display:flex;gap:8px;width:100%}
.pick button{flex:1;font:700 20px var(--body);color:var(--ink);background:var(--btn);border:2px solid var(--line);border-radius:12px;padding:10px 0}
.pick button.on{border-color:var(--yellow);color:var(--yellow)}
.list{width:100%;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:14px 1fr auto auto;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border-radius:12px;text-align:left}
.row .nm{font-weight:700;font-size:21px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;font-weight:500;font-size:15px;color:var(--dim)}
.row .pts{font:700 18px var(--body);color:var(--go)}
.row .tot{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.row.me{outline:2px solid var(--line)}
.row.out .nm,.row.out .tot{opacity:.45}
.badge{font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.note{font-size:16px;color:var(--dim);max-width:36ch;line-height:1.35}
@media (prefers-reduced-motion:reduce){.stage{transition:none}.sym{animation:none}}
.stage.form{user-select:auto;-webkit-user-select:auto}
.back{color:var(--ink);text-decoration:none;font-weight:700;font-size:18px;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.or{font:700 14px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.joinrow{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%}
.joinrow .btn{width:auto;padding-inline:26px}
.field.code{font-family:var(--display);font-size:26px;letter-spacing:.3em;text-transform:uppercase}
.field.code::placeholder{letter-spacing:.3em;color:var(--line)}
.codebig{font-family:var(--display);font-size:clamp(52px,19vw,92px);letter-spacing:.12em;color:var(--yellow);line-height:1}
.sharerow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%}
.link{font-size:15px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;user-select:all;-webkit-user-select:all}
.btn.small{font-size:13px;padding:10px 14px;width:auto}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="chip" id="hd-me"></div>
    <div id="hd-mid">Party mode</div>
    <div id="hd-tot"></div>
  </header>
  <main class="stage" id="stage"><div class="panel"><div class="big">Cab Clash</div><div class="rule">Loading…</div></div></main>
</div>
<script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
<script>
/* ---------- state ---------- */
/* Messages travel through several free public MQTT brokers at once; each phone uses whichever it can reach. */
const BROKERS=window.CC_BROKERS||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const COLORS=['#f6c432','#2fd4c4','#ff6ad5','#5b95ff','#ff9b42','#a78bfa','#38d968','#ff5d5d'];
const MAXP=8, NS='cabclash/v2/', ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const stage=document.getElementById('stage');
let local={k:'',done:false},screen='',tapFn=null,timers=[];
let roundsPick=8,hostBag=[],lastG=-1;
let role=null,code='',base='',myName='',clients=[],seq=0,curHost='',everOpen=false,lastSeen=0,hbT=null,joinT=null,lastRep=null;
let view={st:{ph:'lobby'},players:[]};
const H={players:{},order:[],st:{ph:'lobby'},rej:[]};
let myPid='';
try{myPid=sessionStorage.getItem('cc-pid')||''}catch(e){}
if(!myPid){myPid=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('cc-pid',myPid)}catch(e){}}

function nameOf(id){const p=view.players.find(x=>x.pid===id);return(p&&p.name)||(view.st.nm&&view.st.nm[id])||'Player'}
function colorOf(id){const i=view.players.findIndex(x=>x.pid===id);return COLORS[Math.max(0,i)%COLORS.length]}
const online=id=>{const p=view.players.find(x=>x.pid===id);return!!(p&&p.on)};
const cleanName=s=>String(s||'').replace(/[\u0000-\u001f]/g,'').trim().slice(0,14)||'Player';
const genCode=()=>Array.from({length:4},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');

/* ---------- transport ---------- */
function netOpen(subs,onMsg,onFirst){
  netClose();let first=false;
  BROKERS.forEach(url=>{
    let c;
    try{c=mqtt.connect(url,{clientId:'cc'+Math.random().toString(36).slice(2,12),clean:true,connectTimeout:8000,reconnectPeriod:2500,keepalive:20,resubscribe:true})}catch(e){return}
    c.on('connect',()=>{c.subscribe(subs,{qos:0});if(!first){first=true;onFirst&&onFirst()}});
    c.on('message',(t,buf)=>{if(!buf||!buf.length)return;let d;try{d=JSON.parse(buf.toString())}catch(e){return}if(d&&typeof d==='object')onMsg(t,d)});
    c.on('error',()=>{});
    clients.push(c);
  });
}
function netPub(sub,obj,retain){const s=obj===''?'':JSON.stringify(obj);clients.forEach(c=>{if(c.connected){try{c.publish(base+sub,s,{qos:0,retain:!!retain})}catch(e){}}})}
const netUp=()=>clients.some(c=>c.connected);
function netClose(){clients.forEach(c=>{try{c.end(true)}catch(e){}});clients=[]}
function stopNet(){clearInterval(hbT);clearTimeout(joinT);hbT=joinT=null;netClose()}

/* ---------- host: authoritative referee ---------- */
function hostView(){return{code,host:myPid,seq:++seq,ts:Date.now(),rej:H.rej.slice(-8),st:H.st,
  players:H.order.map(pid=>{const p=H.players[pid];return{pid,name:p.name,on:p.on,rk:p.rep?p.rep.k:''}})}}
function broadcast(){view=hostView();netPub('view',view,true);render()}
function hostCreate(){
  stopNet();role='host';code=genCode();base=NS+code+'/';seq=0;
  let taken=false;
  panel('<div class="eyebrow">Creating party</div><div class="big">One sec…</div>');
  netOpen([base+'view',base+'up'],(t,d)=>{
    if(t===base+'view'){if(d.host&&d.host!==myPid&&Date.now()-(d.ts||0)<60000)taken=true;return}
    if(role==='host'&&H.order.length)hostMsg(d);
  },()=>{
    clearTimeout(joinT);
    setTimeout(()=>{
      if(role!=='host')return;
      if(taken){hostCreate();return}
      H.players={};H.order=[myPid];H.st={ph:'lobby'};H.rej=[];
      H.players[myPid]={name:myName,on:true,seen:Date.now(),rep:null};
      wake();broadcast();
      hbT=setInterval(hostBeat,2500);
    },1200);
  });
  joinT=setTimeout(()=>{if(!netUp())fail('Can’t reach the party server','Your network may be blocking it. Switch between Wi-Fi and mobile data, then try again.')},12000);
}
function hostBeat(){
  const now=Date.now();
  H.order.forEach(pid=>{const p=H.players[pid];if(pid!==myPid&&p.on&&now-p.seen>10000)p.on=false});
  broadcast();
}
function hostMsg(d){
  const pid=String(d.pid||'').slice(0,20);if(!pid||pid===myPid)return;
  const p=H.players[pid],now=Date.now();
  if(d.t==='hello'){
    if(!p&&H.order.length>=MAXP){if(!H.rej.includes(pid)){H.rej.push(pid);broadcast()}return}
    const name=cleanName(d.name),changed=!p||!p.on||p.name!==name;
    H.players[pid]={name,on:true,seen:now,rep:p?p.rep:null};
    if(!p)H.order.push(pid);
    if(changed)broadcast();
  }else if(!p)return;
  else if(d.t==='hb'){p.seen=now;if(!p.on){p.on=true;broadcast()}}
  else if(d.t==='rep'&&d.rep&&typeof d.rep==='object'){
    p.seen=now;p.on=true;const r=d.rep,k=String(r.k||'');
    if(p.rep&&p.rep.k===k)return;
    p.rep={k,v:typeof r.v==='number'?r.v:null,dq:!!r.dq,d:String(r.d||'').slice(0,40)};
    broadcast();
  }else if(d.t==='bye'){if(p.on){p.on=false;broadcast()}}
}
function startMatch(){
  H.order=H.order.filter(pid=>H.players[pid].on);
  const ids=H.order.slice(),nm={},tot={};
  ids.forEach(id=>{nm[id]=H.players[id].name;tot[id]=0});
  hostBag=[];lastG=-1;
  H.st={m:Math.random().toString(36).slice(2,8),ph:'round',r:0,rounds:roundsPick,roster:ids,nm,tot,pts:{},res:{}};
  nextRound();
}
function nextRound(){
  if(!hostBag.length){hostBag=[...GAMES.keys()];for(let i=hostBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[hostBag[i],hostBag[j]]=[hostBag[j],hostBag[i]]}
    if(hostBag[hostBag.length-1]===lastG)hostBag.unshift(hostBag.pop())}
  lastG=hostBag.pop();
  Object.assign(H.st,{ph:'round',r:H.st.r+1,g:lastG,seed:Math.floor(Math.random()*2e9),t0:Date.now(),pts:{},res:{}});
  broadcast();
}
function scoreRound(){
  const st=H.st,key=st.m+':'+st.r,n=st.roster.length,list=[];
  st.roster.forEach(id=>{const p=H.players[id],rep=p&&p.rep;
    if(rep&&rep.k===key){st.res[id]=rep.d;if(!rep.dq&&typeof rep.v==='number')list.push({id,v:rep.v})}
    else st.res[id]=p&&p.on?'No answer':'Disconnected';
    st.pts[id]=0});
  list.sort((a,b)=>a.v-b.v);
  list.forEach(e=>{const rank=list.findIndex(x=>x.v===e.v);st.pts[e.id]=Math.max(0,n-1-rank)});
  st.roster.forEach(id=>{st.tot[id]=(st.tot[id]||0)+st.pts[id];if(H.players[id])st.nm[id]=H.players[id].name});
  st.ph='result';st.tR=Date.now();broadcast();
}
function hostTick(){
  if(role!=='host'||!H.order.length)return;const st=H.st;
  if(st.ph==='round'){
    const key=st.m+':'+st.r,present=st.roster.filter(id=>H.players[id]&&H.players[id].on);
    const all=present.every(id=>{const r=H.players[id].rep;return r&&r.k===key});
    if(all||Date.now()-st.t0>3700+GAMES[st.g].max+8000)scoreRound();
  }else if(st.ph==='result'&&Date.now()-st.tR>6000){
    if(st.r>=st.rounds){st.ph='final';broadcast()}else nextRound();
  }
}
setInterval(hostTick,300);

/* ---------- guest ---------- */
function guestJoin(c){
  stopNet();role='guest';code=c;base=NS+code+'/';everOpen=false;lastSeen=0;seq=0;curHost='';lastRep=null;
  view={st:{ph:'lobby'},players:[]};
  panel(`<div class="eyebrow">Joining ${esc(code)}</div><div class="big">Finding the party…</div>`);
  netOpen([base+'view'],(t,d)=>{
    if(t!==base+'view'||!d.st||!Array.isArray(d.players))return;
    if(Date.now()-(d.ts||0)>90000)return;
    if(d.host!==curHost){curHost=d.host;seq=0}
    if(typeof d.seq!=='number'||d.seq<=seq)return;
    seq=d.seq;lastSeen=Date.now();everOpen=true;
    if(Array.isArray(d.rej)&&d.rej.includes(myPid)){fail('This party is full',`A party holds up to ${MAXP} players.`);return}
    view=d;
    if(!d.players.some(p=>p.pid===myPid))hello();
    render();
  },hello);
  hbT=setInterval(guestBeat,2500);
  joinT=setTimeout(()=>{
    if(everOpen)return;
    if(!netUp())fail('Can’t reach the party server','Your network may be blocking it. Switch between Wi-Fi and mobile data, then try again.');
    else fail(`No party called ${esc(code)}`,'Check the code with the host. The party ends when the host closes the page.');
  },12000);
}
function hello(){netPub('up',{t:'hello',pid:myPid,name:myName})}
function guestBeat(){
  if(role!=='guest'||!netUp())return;
  const meIn=view.players.find(p=>p.pid===myPid);
  if(!meIn)hello();else netPub('up',{t:'hb',pid:myPid});
  if(lastRep&&view.st.ph==='round'&&(!meIn||meIn.rk!==lastRep.k)&&lastRep.k===view.st.m+':'+view.st.r)netPub('up',{t:'rep',pid:myPid,rep:lastRep});
  if(everOpen){
    const gap=Date.now()-lastSeen;
    if(gap>60000)fail('Lost the host','The host may have closed the page or lost signal. Rejoin with the same code once they’re back.');
    else if(gap>10000&&!tapFn&&screen!=='reconnect'){screen='reconnect';panel('<div class="eyebrow">Host not responding</div><div class="big">Reconnecting…</div>','wait')}
  }
}
function sendRep(rep){
  if(role==='host'){H.players[myPid].rep=rep;broadcast()}
  else{lastRep=rep;netPub('up',{t:'rep',pid:myPid,rep})}
}
function leave(){
  if(role==='host')netPub('view','',true);
  else if(role==='guest')netPub('up',{t:'bye',pid:myPid});
}
function fail(title,msg){
  clearTimers();tapFn=null;stopNet();role=null;screen='fail';
  panel(`<div class="eyebrow">Party</div><div class="big">${title}</div><div class="rule">${msg}</div><button class="btn" data-act="home">Back</button>`);
  header();
}

/* ---------- helpers ---------- */
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
async function wake(){try{await navigator.wakeLock.request('screen')}catch(e){}}
function setHTML(el,html){if(el&&el.innerHTML!==html)el.innerHTML=html}
function panel(html,cls){stage.className='stage '+(cls||'');stage.innerHTML='<div class="panel">'+html+'</div>'}

/* ---------- games ---------- */
const INKS=[{n:'Red',c:'#ff5d5d'},{n:'Blue',c:'#5b95ff'},{n:'Green',c:'#38d968'},{n:'Pink',c:'#ff6ad5'}];
function sprint(name,rule,gen){
  return{name,rule:rule+' Five questions; each wrong tap adds 3 seconds.',max:42000,
    play(done){
      const qs=[0,1,2,3,4].map(()=>gen());let k=0,pen=0,ok=0;const t0=performance.now();
      const show=()=>{
        const q=qs[k];const opts=shuffle(q.opts.slice());
        const cls=q.cls||(opts.length===4?'four':'');
        const btns=opts.map(o=>{const v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:o;return`<button class="opt" data-a="${esc(v)}">${esc(l)}</button>`}).join('');
        panel(`<div class="prog">${[0,1,2,3,4].map(j=>`<i class="${j<=k?'on':''}"></i>`).join('')}</div>${q.prompt}<div class="opts ${cls}">${btns}</div>`);
        tapFn=a=>{
          if(a==null)return;
          if(String(a)===String(q.answer)){ok++;buzz(15)}
          else{pen+=3;buzz(120);stage.classList.add('miss');setTimeout(()=>stage.classList.remove('miss'),220)}
          k++;if(k<5)show();else{const v=(performance.now()-t0)/1000+pen;done(v,`${ok}/5 right · ${v.toFixed(1)}s`)}
        };
      };
      later(()=>done(40+pen+5*(5-k),`${ok}/5 right · out of time`),40000);
      show();
    }};
}
const GAMES=[
  {name:'Quick Draw',rule:'Wait for green, then tap. Tap early and you score nothing.',max:8000,
    play(done){
      let go=0;panel('<div class="big">Wait…</div><div class="rule">Hands steady</div>','wait');
      tapFn=()=>{if(!go)done(0,'Jumped the light',true);else{const ms=performance.now()-go;done(ms,Math.round(ms)+' ms')}};
      later(()=>{go=performance.now();buzz(40);panel('<div class="huge">TAP!</div>','go')},1600+R()*3400);
    }},
  {name:'Tap Frenzy',rule:'Five seconds. Tap the screen as many times as you can.',max:6000,
    play(done){
      let n=0;panel('<div class="huge" id="cnt">0</div><div class="rule" id="left">5s left</div>','go');
      tapFn=()=>{n++;const c=document.getElementById('cnt');if(c)c.textContent=n};
      for(let s=4;s>0;s--)later(()=>{const l=document.getElementById('left');if(l)l.textContent=s+'s left'},(5-s)*1000);
      later(()=>done(-n,n+' taps'),5000);
    }},
  {name:'Snap',rule:'Shapes flash one by one. Tap the moment a shape repeats. A false snap scores nothing.',max:14000,
    play(done){
      const SYM=[['★','#f6c432'],['●','#2fd4c4'],['▲','#ff5d5d'],['■','#5b95ff'],['◆','#ff6ad5']];
      const n=ri(4,9),seq=[],gaps=[];let prev=-1;
      for(let k=0;k<n;k++){let s;do{s=ri(0,4)}while(s===prev);seq.push(s);gaps.push(ri(750,1100));prev=s}
      seq.push(prev);let k=-1,shownAt=0;
      const step=()=>{
        k++;const s=SYM[seq[k]];shownAt=performance.now();
        panel(`<div class="sym" style="color:${s[1]}">${s[0]}</div><div class="rule">Tap only on a repeat</div>`);
        if(k===seq.length-1)later(()=>done(0,'Missed the snap',true),1800);else later(step,gaps[k]);
      };
      tapFn=()=>{if(k<0)return;if(k===seq.length-1){const ms=performance.now()-shownAt;done(ms,'Snap in '+Math.round(ms)+' ms')}else done(0,'Snapped too soon',true)};
      step();
    }},
  {name:'Stop the Clock',rule:'The timer hides after a moment. Tap when you think the target time is up.',max:14000,
    play(done){
      const target=ri(4,8),t0=performance.now();
      panel(`<div class="eyebrow">Tap at</div><div class="huge">${target}.0s</div><div class="big" id="clk">0.0</div>`);
      const tick=()=>{const e=(performance.now()-t0)/1000;const c=document.getElementById('clk');if(c)c.textContent=e<1.5?e.toFixed(1):'?.?';if(e<1.6)later(tick,100)};
      tick();
      tapFn=()=>{const t=(performance.now()-t0)/1000;done(Math.abs(t-target),`${t.toFixed(2)}s (target ${target}s)`)};
      later(()=>done(0,'No tap',true),(target+5)*1000);
    }},
  sprint('Mental Math','Solve fast.',()=>{
    const t=ri(0,2);let a,b,ans,s;
    if(t===0){a=ri(14,59);b=ri(12,39);ans=a+b;s=`${a} + ${b}`}
    else if(t===1){a=ri(4,12);b=ri(3,9);ans=a*b;s=`${a} × ${b}`}
    else{a=ri(40,95);b=ri(12,29);ans=a-b;s=`${a} − ${b}`}
    const d=t===1?[a,-a,b,-b,1,-1]:[10,-10,1,-1,2,-2];
    const o=new Set([ans]);while(o.size<3){const v=ans+d[ri(0,d.length-1)];if(v>0)o.add(v)}
    return{prompt:`<div class="eq">${s}</div>`,opts:[...o],answer:ans};
  }),
  sprint('Ink Trap','Ignore the word. Tap the colour of the ink.',()=>{
    const ink=INKS[ri(0,3)];let w;do{w=INKS[ri(0,3)]}while(w===ink);
    return{prompt:`<div class="word" style="color:${ink.c}">${w.n.toUpperCase()}</div>`,opts:INKS.map(x=>x.n),answer:ink.n};
  }),
  sprint('Dot Count','Count the dots.',()=>{
    const n=ri(8,17),cells=shuffle([...Array(32).keys()]).slice(0,n);
    const dots=cells.map(c=>`<span class="dot" style="left:${(c%8)*12.5+6.25+ri(-3,3)}%;top:${Math.floor(c/8)*25+12.5+ri(-6,6)}%"></span>`).join('');
    const o=new Set([n]),d=[1,-1,2,-2];while(o.size<3)o.add(n+d[ri(0,3)]);
    return{prompt:`<div class="dots">${dots}</div>`,opts:[...o],answer:n};
  }),
  sprint('Odd One Out','Find the one impostor in the grid.',()=>{
    const P=[['b','d'],['p','q'],['6','9'],['O','Q'],['M','N'],['E','F'],['8','B'],['5','S'],['m','n'],['C','G'],['V','Y']];
    let [x,y]=P[ri(0,P.length-1)];if(R()<.5)[x,y]=[y,x];
    const odd=ri(0,11);
    return{prompt:'',opts:[...Array(12).keys()].map(k=>({v:k,l:k===odd?y:x})),answer:odd,cls:'grid'};
  }),
  sprint('Bigger One','Tap the bigger value.',()=>{
    const t=ri(0,1);let a,b,va,vb;
    do{
      if(t===0){const n1=ri(1,8),d1=ri(n1+1,9),n2=ri(1,8),d2=ri(n2+1,9);a=`${n1}/${d1}`;b=`${n2}/${d2}`;va=n1/d1;vb=n2/d2}
      else{const x=ri(6,13),y=ri(4,9);a=`${x} × ${y}`;va=x*y;vb=va+ri(-6,6);b=String(vb)}
    }while(va===vb||Math.abs(va-vb)>(t===0?0.15:6));
    return{prompt:'',opts:[{v:'a',l:a},{v:'b',l:b}],answer:va>vb?'a':'b',cls:'two'};
  }),
  sprint('Arrow Flip','SAME means tap that arrow. OPPOSITE means tap the reverse.',()=>{
    const A=['←','↑','→','↓'],k=ri(0,3),same=R()<.5;
    return{prompt:`<div class="tag">${same?'SAME':'OPPOSITE'}</div><div class="sym">${A[k]}</div>`,opts:A.map((a,j)=>({v:j,l:a})),answer:same?k:(k+2)%4,cls:'four'};
  }),
  sprint('Spell It','Tap the word that is spelled right.',()=>{
    const W=[['accommodate','acommodate','accomodate'],['necessary','neccessary','necesary'],['definitely','definately','definitly'],
      ['separate','seperate','separete'],['embarrass','embarass','embarras'],['occurrence','occurence','ocurrence'],
      ['rhythm','rythm','rhythym'],['restaurant','restaraunt','resturant'],['calendar','calender','calandar'],
      ['millennium','millenium','milennium'],['questionnaire','questionaire','questionnair'],['mischievous','mischievious','mischevous'],
      ['privilege','priviledge','privelege'],['guarantee','garantee','guarentee'],['recommend','reccomend','recomend'],
      ['tomorrow','tommorow','tomorow'],['beginning','begining','beggining'],['February','Febuary','Februray'],
      ['pronunciation','pronounciation','pronuncation'],['entrepreneur','entrepeneur','entreprenuer'],['bureaucracy','beaurocracy','bureacracy']];
    const w=W[ri(0,W.length-1)];
    return{prompt:'',opts:w.slice(),answer:w[0],cls:'stack'};
  })
];

/* ---------- screens ---------- */
function header(){
  const st=view.st,inMatch=role&&st.roster&&st.roster.includes(myPid)&&st.ph!=='lobby';
  setHTML(document.getElementById('hd-me'),role?`<i class="dot-c" style="background:${colorOf(myPid)}"></i><span>${esc(myName)}</span>`:'<a class="back" href="./">‹ Menu</a>');
  document.getElementById('hd-mid').textContent=!role?'Party mode':inMatch?(st.ph==='final'?'Final':`Round ${st.r} / ${st.rounds}`):'Party '+code;
  document.getElementById('hd-tot').textContent=inMatch?(st.tot[myPid]||0)+' pts':'';
}
function mount(key,fn){if(screen===key)return;screen=key;fn()}
function renderHome(){
  screen='home';role=null;header();
  let saved='';try{saved=localStorage.getItem('cc-name')||''}catch(e){}
  const q=(new URLSearchParams(location.search).get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  panel(`<div class="eyebrow">Each on your own phone</div><div class="big">Party mode</div>
    <input class="field" id="nm" maxlength="14" placeholder="Your name" value="${esc(saved)}" autocomplete="off" aria-label="Your name">
    <button class="btn" data-act="create">Create a party</button>
    <div class="or">or join one</div>
    <div class="joinrow"><input class="field code" id="cd" maxlength="4" placeholder="CODE" value="${esc(q)}" autocomplete="off" autocapitalize="characters" aria-label="Party code"><button class="btn ghost" data-act="join">Join</button></div>
    <div class="note" id="msg">Up to ${MAXP} players. Keep this page open while you play.</div>`);
  stage.classList.add('form');
}
function takeName(){
  const n=cleanName(document.getElementById('nm').value);myName=n;
  try{localStorage.setItem('cc-name',n)}catch(e){}
}
function renderLobby(){
  mount('lobby-'+role+roundsPick,()=>{
    const link=location.origin+location.pathname+'?code='+code;
    panel(`<div class="eyebrow">Party code</div><div class="codebig">${esc(code)}</div>
      <div class="sharerow"><span class="link" id="lnk">${esc(link)}</span><button class="btn ghost small" data-act="copy">Copy link</button></div>
      <div class="list" id="plist"></div><div class="panel" id="hctl"></div>`);
  });
  setHTML(document.getElementById('plist'),view.players.map((p,i)=>`<div class="row ${p.pid===myPid?'me':''} ${p.on?'':'out'}"><i class="dot-c" style="background:${colorOf(p.pid)}"></i><span class="nm">${esc(p.name)}</span><span class="badge">${i===0?'Host':''}</span><span class="badge">${p.pid===myPid?'You':p.on?'':'Away'}</span></div>`).join(''));
  const n=view.players.filter(p=>p.on).length;
  setHTML(document.getElementById('hctl'),role==='host'
    ?`<div class="eyebrow">Rounds</div><div class="pick">${[5,8,12].map(r=>`<button data-act="rounds" data-n="${r}" class="${r===roundsPick?'on':''}">${r}</button>`).join('')}</div>
      <button class="btn" data-act="start" ${n<2?'disabled':''}>${n<2?'Waiting for players…':`Start · ${n} players`}</button>
      <div class="note">Friends join with the code or the link.</div>`
    :`<div class="note">Waiting for ${esc(view.players[0]?view.players[0].name:'the host')} to start the match.</div>`);
}
function startLocalRound(st){
  clearTimers();tapFn=null;
  R=mulberry(st.seed);const G=GAMES[st.g],key=st.m+':'+st.r;
  panel(`<div class="eyebrow">Round ${st.r} of ${st.rounds}</div><div class="big">${G.name}</div><div class="rule">${G.rule}</div><div class="huge" id="cd">&nbsp;</div>`);
  ['3','2','1'].forEach((n,k)=>later(()=>{const c=document.getElementById('cd');if(c)c.textContent=n},1600+k*700));
  later(()=>{
    let fin=false;
    const done=(v,d,dq)=>{if(fin)return;fin=true;clearTimers();tapFn=null;local.done=true;
      sendRep({k:key,v:dq?null:Math.round(v*1000)/1000,dq:!!dq,d});buzz(30);
      panel(`<div class="eyebrow">Locked in</div><div class="big">${esc(d)}</div><div class="list" id="wl"></div>`,dq?'miss':'');
      updateWaiting(view.st)};
    G.play(done);
  },1600+3*700);
}
function updateWaiting(st){
  const el=document.getElementById('wl');if(!el||!st.roster)return;const key=st.m+':'+st.r;
  setHTML(el,st.roster.map(id=>{const p=view.players.find(x=>x.pid===id),ok=p&&p.rk===key;
    return`<div class="row"><i class="dot-c" style="background:${colorOf(id)}"></i><span class="nm">${esc(nameOf(id))}</span><span class="badge">${ok?'Done':p&&p.on?'Playing…':'Away'}</span><span></span></div>`}).join(''));
}
function renderBoard(st,final){
  const ids=st.roster.slice().sort((a,b)=>(st.tot[b]||0)-(st.tot[a]||0));
  const rows=ids.map(id=>`<div class="row ${id===myPid?'me':''} ${online(id)?'':'out'}"><i class="dot-c" style="background:${colorOf(id)}"></i>
    <span class="nm">${esc(nameOf(id))}<span class="sub">${final?'':esc(st.res[id]||'')}</span></span>
    <span class="pts">${final?'':'+'+(st.pts[id]||0)}</span><span class="tot">${st.tot[id]||0}</span></div>`).join('');
  if(!final){
    panel(`<div class="eyebrow">Round ${st.r} · ${esc(GAMES[st.g]?GAMES[st.g].name:'Results')}</div><div class="big">${(st.pts[myPid]||0)>0?'+'+st.pts[myPid]+' points':'No points'}</div><div class="list">${rows}</div><div class="note">${st.r>=st.rounds?'Final scores next':'Next round starting…'}</div>`);
    return;
  }
  const top=st.tot[ids[0]]||0,winners=ids.filter(id=>(st.tot[id]||0)===top);
  const head=winners.length>1?'It’s a tie':`${esc(nameOf(winners[0]))} wins the ride`;
  panel(`<div class="eyebrow">Final standings</div><div class="big">${head}</div><div class="list">${rows}</div>
    <div class="note">${ids.length>1?esc(nameOf(ids[ids.length-1]))+' buys the snacks.':''}</div>
    ${role==='host'?'<button class="btn" data-act="again">Play again</button><button class="btn ghost" data-act="lobby">Back to lobby</button>':'<div class="note">Waiting for the host to start a rematch.</div>'}`);
}
function render(){
  if(!role||screen==='fail')return;
  header();const st=view.st;
  if(!st||st.ph==='lobby'){renderLobby();return}
  if(!st.roster.includes(myPid)){mount('spec'+st.m,()=>panel('<div class="eyebrow">Match in progress</div><div class="big">Hang tight</div><div class="rule">You’ll join when the host starts the next match.</div>'));return}
  const key=st.m+':'+st.r;
  if(st.ph==='round'){
    if(local.k!==key){local={k:key,done:false};screen='round'+key;startLocalRound(st)}
    else if(local.done){
      if(screen==='reconnect'){screen='round'+key;panel('<div class="eyebrow">Locked in</div><div class="big">Waiting for the others</div><div class="list" id="wl"></div>')}
      updateWaiting(st);
    }
    return;
  }
  if(local.k===key&&!local.done){clearTimers();tapFn=null;local.done=true}
  if(st.ph==='result')mount('res'+key,()=>renderBoard(st,false));
  else if(st.ph==='final')mount('fin'+key,()=>renderBoard(st,true));
}

/* ---------- input ---------- */
stage.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!b.dataset.act)return;
  const a=b.dataset.act,msg=document.getElementById('msg');
  if(a==='create'){takeName();hostCreate()}
  if(a==='join'){
    const c=document.getElementById('cd').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(c.length!==4){if(msg)msg.textContent='Enter the 4-character code from the host.';return}
    takeName();guestJoin(c);
  }
  if(a==='rounds'){roundsPick=+b.dataset.n;screen='';render()}
  if((a==='start'||a==='again')&&role==='host'&&(H.st.ph==='lobby'||H.st.ph==='final'))startMatch();
  if(a==='lobby'&&role==='host'){H.st={ph:'lobby'};H.order=H.order.filter(pid=>H.players[pid].on);screen='';broadcast()}
  if(a==='copy'){
    const t=document.getElementById('lnk').textContent;
    const ok=()=>{b.textContent='Copied'};
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{});
  }
  if(a==='home'){leave();stopNet();screen='';renderHome()}
});
stage.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cd'){const j=stage.querySelector('[data-act="join"]');j&&j.click()}});
stage.addEventListener('pointerdown',e=>{
  if(!tapFn)return;e.preventDefault();
  const b=e.target.closest('[data-a]');tapFn(b?b.dataset.a:null);
});
window.addEventListener('beforeunload',e=>{if(role==='host'&&H.order.length>1){e.preventDefault();e.returnValue=''}});
window.addEventListener('pagehide',leave);
if(typeof mqtt==='undefined')fail('Couldn’t load the party engine','Check your internet connection and reload the page.');
else renderHome();
</script>
